name: Diagnose AnchorDock 0.3 validation

on:
  push:
    branches: ["agent/final-engine-cleanup"]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-engine-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Validate and persist concise result
        shell: bash
        run: |
          set +e
          : > /tmp/validation.log
          uv lock >>/tmp/validation.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then uv sync --frozen --group dev >>/tmp/validation.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then uv run ruff check src tests examples >>/tmp/validation.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then uv run pytest -q >>/tmp/validation.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then uv build --wheel >>/tmp/validation.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then uv run anchor-dock --help >>/tmp/validation.log 2>&1; status=$?; fi

          rm -f .validation-success.txt .validation-error.txt
          if [ "$status" -eq 0 ]; then
            printf 'SUCCESS\n' > .validation-success.txt
          else
            {
              printf 'FAILED status=%s\n' "$status"
              tail -80 /tmp/validation.log
            } > .validation-error.txt
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock .validation-success.txt .validation-error.txt 2>/dev/null || true
          git commit -m "chore: record AnchorDock validation result" || true
          git push origin HEAD:agent/final-engine-cleanup
          exit "$status"

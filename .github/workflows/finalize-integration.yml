name: Finalize AnchorDock integration

on:
  push:
    branches: ["agent/final-engine-cleanup"]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-merge-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-engine-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Validate and finalize
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          : > /tmp/validation.log
          uv lock >>/tmp/validation.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then uv sync --frozen --group dev >>/tmp/validation.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then uv run ruff check --fix src tests examples >>/tmp/validation.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then uv run ruff format src tests examples >>/tmp/validation.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then uv run ruff check src tests examples >>/tmp/validation.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then uv run pytest -q >>/tmp/validation.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then uv build --wheel >>/tmp/validation.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then uv run anchor-dock --help >>/tmp/validation.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then
            python - <<'PY' >>/tmp/validation.log 2>&1
          from pathlib import Path
          import zipfile

          wheel = next(Path("dist").glob("anchor_dock-*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert any(name.startswith("anchor_dock/") for name in names)
          assert not any(name.startswith("lig_align/") for name in names)
          assert not any(name.startswith("cov_vina/") for name in names)
          assert not any("__pycache__" in name or name.endswith(".pyc") for name in names)
          PY
            status=$?
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            rm -f .validation-success.txt
            {
              printf 'FAILED status=%s\n' "$status"
              tail -100 /tmp/validation.log
            } > .validation-error.txt
            git add .validation-error.txt .validation-success.txt uv.lock 2>/dev/null || true
            git commit -m "chore: record AnchorDock validation failure" || true
            git push origin HEAD:agent/final-engine-cleanup
            exit "$status"
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/anchor-dock-ci.yml")
          text = path.read_text()
          old = """      - name: Resolve environment
        run: |
          uv lock
          uv sync --frozen --group dev
"""
          new = """      - name: Check lock file
        run: uv lock --check
      - name: Sync frozen environment
        run: uv sync --frozen --group dev
"""
          if old in text:
              path.write_text(text.replace(old, new))
          PY

          rm -f .validation-success.txt .validation-error.txt
          rm -f .github/workflows/validate-final.yml
          rm -f .github/workflows/diagnose-final.yml
          rm -f .github/workflows/finalize-integration.yml
          rm -rf dist build .venv
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A
          git commit -m "chore: freeze validated AnchorDock 0.3 environment"
          git push origin HEAD:agent/final-engine-cleanup
          head_sha=$(git rev-parse HEAD)

          merge_status=$(curl -sS -o /tmp/merge.json -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/4/merge" \
            -d "{\"merge_method\":\"squash\",\"sha\":\"${head_sha}\",\"commit_title\":\"feat: finalize AnchorDock 0.3 engine and batch API (#4)\"}")
          if [ "$merge_status" -lt 200 ] || [ "$merge_status" -ge 300 ]; then
            cat /tmp/merge.json
            exit 1
          fi

          sleep 5
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/finalize-main.yml
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore: remove completed branch finalizer"
            git push origin main
          fi

          delete_status=$(curl -sS -o /tmp/delete.json -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/final-engine-cleanup")
          case "$delete_status" in
            204|404|422) ;;
            *) cat /tmp/delete.json; exit 1 ;;
          esac

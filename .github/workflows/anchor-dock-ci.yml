name: AnchorDock CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Resolve environment
        run: uv lock && uv sync --group dev
      - name: Test
        run: uv run pytest -q
      - name: Build wheel
        run: uv build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: anchor-dock-build
          path: |
            uv.lock
            dist/*.whl

name: AnchorDock CI

on:
  push:
    branches: [main, "agent/**", "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.10.3
      - name: Check lock file
        run: uv lock --check
      - name: Sync frozen environment
        run: uv sync --frozen --group dev
      - name: Lint
        run: uv run --frozen ruff check src tests examples
      - name: Test
        run: uv run --frozen pytest -q
      - name: Build wheel
        run: uv build --wheel
      - name: Test installed wheel and CLI
        run: |
          wheel="$(realpath "$(find dist -maxdepth 1 -name 'anchor_dock-*.whl' -print -quit)")"
          test -n "$wheel"
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          uv run --isolated --no-project --with "$wheel" python -c \
            'import importlib.metadata, importlib.util, inspect, anchor_dock; from anchor_dock.core.output import OUTPUT_SCHEMA_VERSION; assert anchor_dock.__version__ == importlib.metadata.version("anchor-dock") == "0.5.0"; assert OUTPUT_SCHEMA_VERSION == "4"; assert all(hasattr(anchor_dock, name) for name in ("dock_reference", "dock_covalent", "dock_interaction", "dock_batch")); params = inspect.signature(anchor_dock.dock_interaction).parameters; assert "interactions" in params and "max_joint_matches" in params; assert not hasattr(anchor_dock, "dock_free"); assert importlib.util.find_spec("anchor_dock.free") is None; assert importlib.util.find_spec("lig_align") is None; assert importlib.util.find_spec("cov_vina") is None; assert importlib.util.find_spec("anchor_dock.reference.aligner") is None'
          for command in reference covalent interaction batch; do
            uv run --isolated --no-project --with "$wheel" anchor-dock "$command" --help
          done
          uv run --isolated --no-project --with "$wheel" anchor-dock interaction --help | grep -q -- "--interactions-json"
      - name: Pack source snapshot
        run: git archive --format=tar.gz --output=anchor-dock-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: anchor-dock-build
          path: |
            uv.lock
            dist/*.whl
            anchor-dock-source.tar.gz

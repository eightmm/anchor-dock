name: AnchorDock CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Check lock file
        run: uv lock --check
      - name: Sync frozen environment
        run: uv sync --frozen --group dev
      - name: Lint
        run: uv run ruff check src/ scripts/ tests/
      - name: Test
        run: uv run pytest -q
      - name: Build wheel
        run: uv build --wheel
      - name: Pack source snapshot
        run: |
          tar -czf anchor-dock-source.tar.gz \
            .github src docs tests scripts examples reports \
            README.md LICENSE pyproject.toml uv.lock
      - uses: actions/upload-artifact@v4
        with:
          name: anchor-dock-build
          path: |
            uv.lock
            dist/*.whl
            anchor-dock-source.tar.gz

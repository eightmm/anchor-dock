name: AnchorDock CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Resolve environment
        run: |
          uv lock
          uv sync --frozen --group dev
      - name: Lint
        run: uv run ruff check src tests examples
      - name: Test
        run: uv run pytest -q
      - name: Build wheel
        run: uv build --wheel
      - name: Verify wheel namespace and CLI
        run: |
          uv run anchor-dock --help
          python - <<'PY'
          import pathlib
          import zipfile

          wheel = next(pathlib.Path("dist").glob("anchor_dock-*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert any(name.startswith("anchor_dock/") for name in names)
          assert not any(name.startswith("lig_align/") for name in names)
          assert not any(name.startswith("cov_vina/") for name in names)
          assert not any("__pycache__" in name or name.endswith(".pyc") for name in names)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: anchor-dock-build
          path: |
            uv.lock
            dist/*.whl

name: Validate and freeze AnchorDock 0.3

on:
  push:
    branches: ["agent/final-engine-cleanup"]

permissions:
  contents: write

jobs:
  validate-and-freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-engine-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Resolve environment
        run: |
          uv lock
          uv sync --frozen --group dev
      - name: Validate source and distribution
        run: |
          uv run ruff check src tests examples
          uv run pytest -q
          uv build --wheel
          uv run anchor-dock --help >/dev/null
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path("dist").glob("anchor_dock-*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert any(name.startswith("anchor_dock/") for name in names)
          assert not any(name.startswith("lig_align/") for name in names)
          assert not any(name.startswith("cov_vina/") for name in names)
          assert not any("__pycache__" in name or name.endswith(".pyc") for name in names)
          PY
      - name: Freeze CI and commit lock file
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/anchor-dock-ci.yml")
          text = path.read_text()
          old = """      - name: Resolve environment
        run: |
          uv lock
          uv sync --frozen --group dev
"""
          new = """      - name: Check lock file
        run: uv lock --check
      - name: Sync frozen environment
        run: uv sync --frozen --group dev
"""
          if old not in text:
              raise SystemExit("temporary CI block not found")
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/validate-final.yml
          rm -rf dist build .venv
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: freeze AnchorDock 0.3 environment"
          git push origin HEAD:agent/final-engine-cleanup

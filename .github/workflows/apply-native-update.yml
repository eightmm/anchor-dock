name: Inspect staged AnchorDock archive

on:
  push:
    branches: ["agent/native-batch-scoring-engine"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Inspect archive
        run: |
          stat -c 'archive_size=%s' .anchor-native-update.tar.gz
          sha256sum .anchor-native-update.tar.gz
          python - <<'PY'
          from pathlib import Path
          data = Path('.anchor-native-update.tar.gz').read_bytes()
          print(f'prefix_hex={data[:16].hex()}')
          print(f'suffix_hex={data[-32:].hex()}')
          PY

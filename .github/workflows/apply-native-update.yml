name: Apply native AnchorDock update

on:
  push:
    branches: ["agent/native-batch-scoring-engine"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Apply source snapshot
        run: |
          rm -rf src docs tests scripts
          tar -xzf .anchor-native-update.tar.gz
          rm -f .anchor-native-update.tar.gz
          rm -f .github/workflows/apply-native-update.yml
      - name: Resolve environment
        run: |
          uv lock
          uv sync --frozen --group dev
      - name: Validate
        run: |
          uv run pytest -q
          uv build --wheel
          python - <<'PY'
          import pathlib
          import zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert any(name.startswith("anchor_dock/") for name in names)
          assert not any(name.startswith("lig_align/") for name in names)
          assert not any(name.startswith("cov_vina/") for name in names)
          PY
      - name: Commit native implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: replace compatibility layers with native docking engine"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"

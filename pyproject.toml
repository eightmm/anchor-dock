[project]
name = "anchor-dock"
version = "0.4.0"
description = "Torch-native reference-guided, covalent, and interaction-guided local ligand docking"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy>=2.4.2",
    "rdkit>=2025.9.5",
    "torch>=2.10.0",
]

[project.scripts]
anchor-dock = "anchor_dock.cli:main"

[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["anchor_dock*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

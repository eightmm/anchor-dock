[project]
name = "anchor-dock"
version = "0.2.0"
description = "Anchor- and constraint-guided ligand pose prediction with reference and covalent docking modes"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy>=2.4.2",
    "rdkit>=2025.9.5",
    "torch>=2.10.0",
]

[project.optional-dependencies]
# lig_align.io.visualization and the scripts/vis_*.py renderers only.
viz = [
    "matplotlib>=3.10",
    "pillow>=11.0",
]

[project.scripts]
anchor-dock = "anchor_dock.cli:main"

[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["anchor_dock*", "lig_align*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# F catches real defects, I and UP are mechanically fixable. E501 is excluded
# because the numeric kernels read better as wide expressions than wrapped ones.
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
